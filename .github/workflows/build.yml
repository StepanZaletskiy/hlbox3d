# Builds box3d.hdll on both systems the game ships to and runs the checks
# on each, so a change to the shim is tried where it will be used, not
# only where it is cheapest.
#
#   linux    the Steam Deck side: libhl built from the fetched sources,
#            the way the game's own Linux workflow does it
#   windows  the artist's side: hl.h and libhl.lib taken from the same
#            release archive the game builds against, never built here
#   web      the same shim as box3d.js and box3d.wasm by Emscripten, the
#            checks compiled to JavaScript and run under node
#   pages    the Driving sample built for the browser on that module and
#            put on GitHub Pages, from main only
#
# The checks are Box3D's own unit tests run through the binding, on the
# float module, on the large-world one and on the web one; they are what
# fails the run.

name: Build

on:
  workflow_dispatch:
  push:

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          set -eux
          sudo apt-get update -y
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build

      # Before the configure: the check target is only made when haxe is
      # found then.
      - name: Get Haxe
        run: |
          set -eux
          curl -fsSL -o haxe.tar.gz \
            https://github.com/HaxeFoundation/haxe/releases/download/4.3.6/haxe-4.3.6-linux64.tar.gz
          mkdir -p haxe && tar -xzf haxe.tar.gz -C haxe --strip-components=1
          echo "$PWD/haxe" >> "$GITHUB_PATH"
          echo "HAXE_STD_PATH=$PWD/haxe/std" >> "$GITHUB_ENV"

      # Configuring fetches Box3D and the HashLink sources into build/_deps.
      # Only libhl and the hl binary are built from the latter: no .hdll
      # from the runtime is needed here, the checks draw nothing and open
      # no window.
      - name: Build box3d.hdll
        run: |
          set -eux -o pipefail
          start=$(date +%s)
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)" 2>&1 | tee build/build.log
          echo "::notice title=Build time::$(( $(date +%s) - start ))s from cold"
          ls -la build/box3d.hdll

      # What Box3D exports against what the shim calls. It costs a second
      # and it catches the thing nobody notices - Box3D grows a function
      # and the binding quietly does not have it.
      - name: Coverage
        shell: pwsh
        run: ./.github/coverage.ps1

      # Exports are worth checking before running: a .hdll missing a symbol
      # does not fail to build, it fails to load, and the message names only
      # the first missing function.
      - name: Check exports
        run: |
          set -eux
          nm -D --defined-only build/box3d.hdll > exports.txt
          for want in box3d_init box3d_world_create box3d_world_add_body \
                      box3d_shape_box box3d_shape_sphere box3d_shape_capsule \
                      box3d_world_step box3d_world_get_transform; do
            grep -q " $want\$" exports.txt || { echo "$want missing from box3d.hdll"; exit 1; }
          done

      # The gate: Box3D's own tests through the public API, printed as its
      # own runner prints them, and Box3D's own voice listened to from the
      # first line, so a warning from it is a failure here. The same
      # command as on a machine.
      - name: Run the checks
        run: |
          set -eux -o pipefail
          cmake --build build --target check 2>&1 | tee build/check.log | tail -5

      # Box3D's own test binary, built from the same fetched sources and run
      # beside ours, then the two outputs compared subtest for subtest. The
      # README claims a number; this is what keeps it true when Box3D grows
      # a test.
      - name: Parity with Box3D's own tests
        run: |
          set -eux -o pipefail
          cmake -S build/_deps/box3d-src -B build/box3d-test -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBOX3D_UNIT_TESTS=ON \
            -DBOX3D_SAMPLES=OFF -DBOX3D_BENCHMARKS=OFF
          cmake --build build/box3d-test -j"$(nproc)" --target test
          build/box3d-test/bin/test > build/theirs.txt
          pwsh ./.github/parity.ps1 -Theirs build/theirs.txt -Ours build/check.log

      # The other build of the module: positions as doubles, for worlds
      # too big for a float. Built here rather than only on a release
      # because it is the half nobody would notice had gone stale. It has
      # the far halves the float build cannot hold, so the checks run more
      # of them.
      - name: Build the large-world module and check it
        run: |
          set -eux -o pipefail
          cmake -S . -B build-large -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHL_ROOT="$GITHUB_WORKSPACE/build/_deps/hashlink-src" \
            -DFETCHCONTENT_SOURCE_DIR_BOX3D="$GITHUB_WORKSPACE/build/_deps/box3d-src" \
            -DHLBOX3D_LARGE_WORLD=ON
          cmake --build build-large -j"$(nproc)"
          ls -la build-large/box3d.hdll
          cmake --build build-large --target check 2>&1 | tail -5

      - uses: actions/upload-artifact@v4
        with:
          name: box3d.hdll-linux
          path: |
            build/box3d.hdll
            build-large/box3d.hdll
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # The HashLink sources are not needed here at all: the headers and the
      # import library come out of the release archive below, exactly the
      # ones the game will be running next to.
      - uses: actions/checkout@v4

      - name: Get the HashLink release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 1.16 --repo HaxeFoundation/hashlink --pattern "*win*.zip" --output hl.zip --clobber
          Expand-Archive hl.zip -DestinationPath runtime -Force
          $inc = Get-ChildItem runtime -Recurse -Filter hl.h -File | Select-Object -First 1
          $lib = Get-ChildItem runtime -Recurse -Filter libhl.lib -File | Select-Object -First 1
          $exe = Get-ChildItem runtime -Recurse -Filter hl.exe -File | Select-Object -First 1
          if (-not $inc -or -not $lib -or -not $exe) { throw "the archive lacks hl.h, libhl.lib or hl.exe" }
          # No BOM: the runner reads this file as UTF-8 and PowerShell writes
          # one readily, and then the value carries three bytes of junk.
          [IO.File]::AppendAllText($env:GITHUB_ENV,
            "HL_INCLUDE=$($inc.DirectoryName)`nHL_LIB=$($lib.FullName)`nHL_BIN=$($exe.DirectoryName)`n",
            (New-Object Text.UTF8Encoding $false))

      - name: Build box3d.hdll
        shell: pwsh
        run: |
          $start = Get-Date
          cmake -S . -B build -A x64 -DHL_INCLUDE="$env:HL_INCLUDE" -DHL_LIB="$env:HL_LIB"
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          $took = [int]((Get-Date) - $start).TotalSeconds
          Write-Host "::notice title=Build time (Windows)::${took}s from cold"
          if (-not (Test-Path build/box3d.hdll)) { throw "build/box3d.hdll is not there" }
          Get-Item build/box3d.hdll | Format-Table Name, Length

      - name: Get Haxe
        shell: pwsh
        run: |
          curl.exe -fsSL -o haxe.zip https://github.com/HaxeFoundation/haxe/releases/download/4.3.6/haxe-4.3.6-win64.zip
          Expand-Archive haxe.zip -DestinationPath haxe -Force
          $exe = Get-ChildItem haxe -Recurse -Filter haxe.exe -File | Select-Object -First 1
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$($exe.DirectoryName)`n", (New-Object Text.UTF8Encoding $false))
          [IO.File]::AppendAllText($env:GITHUB_ENV, "HAXE_STD_PATH=$($exe.DirectoryName)\std`n", (New-Object Text.UTF8Encoding $false))

      - name: Compile the checks
        shell: pwsh
        run: |
          haxe test/Main.hxml
          if ($LASTEXITCODE -ne 0) { throw "haxe failed on the checks" }

      # The gate, the same as on the other system.
      - name: Run the checks
        shell: pwsh
        run: |
          Copy-Item "$env:HL_BIN\*.dll" build\
          Copy-Item "$env:HL_BIN\hl.exe" build\
          Push-Location build
          $out = & .\hl.exe check.hl 2>&1
          $code = $LASTEXITCODE
          Pop-Location
          $out | Select-Object -Last 5 | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) { throw "$code checks failed" }

      # The double-precision build, and the same checks against it.
      - name: Build the large-world module and check it
        shell: pwsh
        run: |
          cmake -S . -B build-large -A x64 -DHL_INCLUDE="$env:HL_INCLUDE" -DHL_LIB="$env:HL_LIB" -DFETCHCONTENT_SOURCE_DIR_BOX3D="$env:GITHUB_WORKSPACE\build\_deps\box3d-src" -DHLBOX3D_LARGE_WORLD=ON
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          cmake --build build-large --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          if (-not (Test-Path build-large/box3d.hdll)) { throw "build-large/box3d.hdll is not there" }
          Copy-Item build\check.hl build-large\
          Copy-Item "$env:HL_BIN\*.dll" build-large\
          Copy-Item "$env:HL_BIN\hl.exe" build-large\
          Push-Location build-large
          $out = & .\hl.exe check.hl 2>&1
          $code = $LASTEXITCODE
          Pop-Location
          $out | Select-Object -Last 5 | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) { throw "$code checks failed on the large-world build" }

      - uses: actions/upload-artifact@v4
        with:
          name: box3d.hdll-windows
          path: |
            build/box3d.hdll
            build-large/box3d.hdll
          retention-days: 14

  # The same shim as a wasm module, and the same checks compiled to
  # JavaScript and run under node, which the Emscripten SDK carries.
  web:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          set -eux
          sudo apt-get update -y
          sudo apt-get install --no-install-recommends -y cmake ninja-build

      - name: Get Haxe
        run: |
          set -eux
          curl -fsSL -o haxe.tar.gz \
            https://github.com/HaxeFoundation/haxe/releases/download/4.3.6/haxe-4.3.6-linux64.tar.gz
          mkdir -p haxe && tar -xzf haxe.tar.gz -C haxe --strip-components=1
          echo "$PWD/haxe" >> "$GITHUB_PATH"
          echo "HAXE_STD_PATH=$PWD/haxe/std" >> "$GITHUB_ENV"

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.9
          actions-cache-folder: emsdk-cache

      - name: Build box3d.js and box3d.wasm
        run: |
          set -eux -o pipefail
          emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web -j"$(nproc)"
          ls -la build-web/box3d.js build-web/box3d.wasm

      # The gate, the same as on the other systems: Box3D's own tests, this
      # time through wasm. The determinism scenes must reach the same
      # hashes as the native builds.
      - name: Run the checks
        run: |
          set -eux -o pipefail
          cmake --build build-web --target check 2>&1 | tail -5

      - uses: actions/upload-artifact@v4
        with:
          name: box3d-web
          path: |
            build-web/box3d.js
            build-web/box3d.wasm
          retention-days: 14

  # The sample in the browser, at https://stepanzaletskiy.github.io/hlbox3d/:
  # samples/ compiled with haxe -js against the web module the job above
  # just built and checked, with sample.html as the index. Only from main,
  # so the page is what the README describes.
  pages:
    needs: [web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Get Haxe
        run: |
          set -eux
          curl -fsSL -o haxe.tar.gz \
            https://github.com/HaxeFoundation/haxe/releases/download/4.3.6/haxe-4.3.6-linux64.tar.gz
          mkdir -p haxe && tar -xzf haxe.tar.gz -C haxe --strip-components=1
          echo "$PWD/haxe" >> "$GITHUB_PATH"
          echo "HAXE_STD_PATH=$PWD/haxe/std" >> "$GITHUB_ENV"

      # Heaps from git, as the README installs it: the sample is written
      # against its master, and the haxelib release lags it. format, its
      # one dependency, comes with it.
      - name: Get Heaps
        run: |
          set -eux
          haxelib setup "$PWD/haxelib"
          haxelib git heaps https://github.com/HeapsIO/heaps.git --quiet

      - uses: actions/download-artifact@v4
        with:
          name: box3d-web
          path: build/samples-web

      - name: Build the sample
        run: |
          set -eux
          (cd samples && haxe sample_js.hxml)
          cp samples/sample.html build/samples-web/index.html
          ls -la build/samples-web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/samples-web

      - id: deploy
        uses: actions/deploy-pages@v4

  # What `haxelib run hlbox3d install` downloads: the two builds of the
  # module for both systems and the web module, as loose files on the
  # release. Made only for a tag, and only if the checks above passed on
  # every system - a release that was never checked is worse than none,
  # because it is the one people trust.
  #
  #   git tag v0.1.0 && git push origin v0.1.0
  release:
    needs: [linux, windows, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: box3d.hdll-linux
          path: linux

      - uses: actions/download-artifact@v4
        with:
          name: box3d.hdll-windows
          path: windows

      - uses: actions/download-artifact@v4
        with:
          name: box3d-web
          path: web

      # Six files with fixed names, which is what `haxelib run hlbox3d
      # install` downloads for the version in haxelib.json: the module for
      # each system in both builds, and the web module. The Haxe side comes
      # from git, so there is no archive to assemble.
      - name: Assets
        run: |
          set -eux
          mkdir -p assets
          cp linux/build/box3d.hdll assets/box3d-linux.hdll
          cp linux/build-large/box3d.hdll assets/box3d-linux-large-world.hdll
          cp windows/build/box3d.hdll assets/box3d-windows.hdll
          cp windows/build-large/box3d.hdll assets/box3d-windows-large-world.hdll
          cp web/box3d.js web/box3d.wasm assets/
          ls -la assets

      # The gh CLI rather than an action from someone else: it is on the
      # runner already, and a release is not the place to trust a third
      # party with a write token.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "$GITHUB_REF_NAME" \
            --notes "Box3D for HashLink, Heaps and the web. Install with haxelib git hlbox3d https://github.com/StepanZaletskiy/hlbox3d, then haxelib run hlbox3d install: it downloads the module here for your system. box3d-<system>.hdll has float positions, -large-world doubles; box3d.js and box3d.wasm are the same shim for the JavaScript target, haxelib run hlbox3d install --web <dir> fetches them."
